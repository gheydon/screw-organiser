name: Build release trays

on:
  release:
    types: [published]
  # manual runs build everything and keep the bundles as workflow artifacts
  # (nothing is uploaded to a release)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # labels default to Arial; pull in the MS core fonts so CI output
      # matches local builds
      - name: Install label fonts
        run: |
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt-get update
          sudo apt-get install -y ttf-mscorefonts-installer fontconfig
          fc-cache -f

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Build all trays
        run: |
          TAG="${{ github.event.release.tag_name }}"
          # release tag goes under the tray's own version stamp
          make -j2 everything EXTRA="${TAG:+--release-text $TAG}"

      - name: Bundle by variant
        run: |
          cd out
          zip -j ../screw-organiser-3mf.zip *.3mf
          zip -j ../screw-organiser-stl.zip *.stl
          zip -j ../screw-organiser-stackable.zip stackable/*.3mf
          zip -j ../screw-organiser-gridfinity.zip gridfinity/*.3mf

      - name: Attach bundles to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" screw-organiser-*.zip --clobber

      - name: Keep bundles as artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: tray-bundles
          path: screw-organiser-*.zip
